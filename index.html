<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>핑 한국어 문법 카드 (9:16)</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+TC:wght@300;400&family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --kraft: #c9a783;
    --purple: #7d4a77;
    --blue: #5a93b1;
    --ink: #1d1d1d;
    --marker: #2b3a8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: #d9d4cc;
    font-family: 'Gaegu', 'Comic Sans MS', 'Segoe Print', cursive;
    color: var(--ink);
  }
  h1 { text-align: center; font-size: 26px; margin: 0 0 8px; }
  .sub {
    text-align: center; font-size: 15px; color: #555; margin-bottom: 24px;
    font-family: 'Noto Sans TC', sans-serif; font-weight: 300;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 28px;
    justify-items: center;
  }

  /* 9:16 card */
  .card {
    position: relative;
    width: 360px;
    height: 640px;
    background: var(--kraft);
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(160deg, transparent 0 22%, var(--purple) 22% 52%, transparent 52%),
      linear-gradient(200deg, transparent 0 28%, var(--blue) 28% 60%, transparent 60%),
      linear-gradient(20deg, transparent 0 70%, var(--purple) 70% 100%);
    opacity: .95;
  }
  .card::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px) 0 0 / 4px 4px;
  }

  .paper {
    position: absolute;
    left: 14px; right: 14px; top: 34px; bottom: 22px;
    background: #f4f3ef;
    padding: 22px 16px 10px;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
    display: flex; flex-direction: column;
  }
  .col { display: contents; }
  .tape {
    position: absolute;
    left: 50%; top: 14px;
    transform: translateX(-50%) rotate(-1.5deg);
    width: 120px; height: 26px;
    background: #111; opacity: .9; z-index: 3;
    clip-path: polygon(3% 0, 100% 8%, 97% 100%, 0 90%);
  }
  .qmark {
    position: absolute; right: 10px; top: 46px;
    font-size: 46px; color: var(--marker);
    transform: rotate(8deg); z-index: 3; font-weight: 700;
  }
  .num {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px; text-align: left; letter-spacing: 1px; margin-bottom: 5px;
  }
  .gtitle {
    font-family: '이랑체', 'Gaegu', cursive;
    font-size: 22px; font-weight: 700; text-align: left; line-height: 1.2; margin: 0 0 4px; padding-right: 34px;
  }
  .gram {
    font-family: 'Noto Sans TC', sans-serif; font-weight: 300;
    font-size: 12px; line-height: 1.3; color: #333; text-align: left; margin-bottom: 2px;
  }
  .gsub {
    font-family: 'Noto Sans TC', sans-serif; font-weight: 300;
    font-size: 11px; text-align: left; color: #4a4a4a; margin-bottom: 10px;
  }

  /* hand-drawn box */
  .box {
    position: relative;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 255px 14px 225px 16px / 16px 225px 14px 255px;
    padding: 8px 10px 7px;
    transform: rotate(-.6deg);
    text-align: left;
  }
  .line {
    font-family: 'Gaegu', cursive;
    font-size: 21px; font-weight: 700; line-height: 1.3;
  }
  .zhline {
    font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
    font-size: 14px; line-height: 1.4;
    color: #3b2a4f;
    margin-top: 5px;
  }
  .pron {
    font-size: 14px; text-align: left; color: #6a2e6a;
    margin: 5px 0 8px; letter-spacing: .3px; line-height: 1.35;
  }

  /* explanation with hanging indent */
  .sec {
    font-size: 13px; line-height: 1.4; margin: 3px 0;
    padding-left: 42px; text-indent: -42px;
  }
  .sec b {
    display: inline-block; width: 42px; text-indent: 0;
    color: var(--marker); font-weight: 700;
  }
  .zh-exp { font-family: 'Noto Sans TC', sans-serif; }
  .ko-exp { font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; }

  /* more examples */
  .exlabel {
    font-size: 12px; color: var(--marker); font-weight: 700; margin-top: 6px;
    font-family: 'Gaegu', cursive;
  }
  .ex {
    font-size: 12px; line-height: 1.3; margin: 3px 0 0;
  }
  .ex .exko {
    font-family: 'Gaegu', cursive; font-size: 13px; font-weight: 700;
  }
  .ex .expron { color: #6a2e6a; font-size: 11px; margin-left: 3px; }
  .ex .exzh {
    display: block; font-family: 'Noto Sans TC', sans-serif;
    font-size: 10.5px; font-weight: 300; color: #333;
  }

  /* 為什麼 block */
  .why {
    margin-top: auto;
    border-top: 1px dashed #888;
    padding-top: 5px;
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    font-weight: 300;
    font-size: 10.5px;
    line-height: 1.3;
    color: #222;
  }
  .why .lbl { font-weight: 400; color: #a33; margin-right: 4px; }
  .why .zh { display: block; margin-top: 2px; }

  /* ---- site layout: index of lessons + one lesson at a time ---- */
  body:not(.view-card) .grid { display: none; }
  body.view-card .grid { display: flex; justify-content: center; }
  body.view-card .index { display: none; }
  body.view-card h1, body.view-card .sub { display: none; }
  .index {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px; max-width: 1000px; margin: 0 auto;
  }
  .tile {
    display: block; text-decoration: none; color: var(--ink);
    background: #fff; border: 2px solid var(--ink); padding: 12px 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }
  .tile:hover { background: #fff9d6; }
  .tnum { display: block; font-family: 'Press Start 2P', monospace; font-size: 10px; margin-bottom: 6px; }
  .ttitle { display: block; font-family: 'Gaegu', cursive; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .tsub { display: block; font-size: 12px; color: #555; margin-top: 4px; font-family: 'Noto Sans TC', sans-serif; }
  .nav { display: flex; justify-content: center; gap: 14px; margin: 0 0 14px; font-family: 'Gaegu', cursive; font-size: 20px; font-weight: 700; }
  body:not(.view-card) .nav { display: none; }
  .nav a { color: var(--marker); text-decoration: none; padding: 2px 8px; background: #fff; border: 2px solid var(--ink); }
  .nav a:hover { background: #fff9d6; }


  /* message bar for errors */
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 16px; border-radius: 8px;
    font-family: 'Noto Sans TC', sans-serif; font-size: 14px; max-width: 90vw;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>핑 한국어 문법 카드 · 기본 어법 순서</h1>
<div class="sub">9/3 ~ 11/6 회차 · 기본 조사·문장 → 활용 → 부정·연결 → 관형형 → 추측·복합 순</div>
<div class="index" id="index"></div>
<div class="nav" id="nav"></div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<script>

const CN = ["名詞＋是（이에요／예요）", "受詞助詞（目的格）", "「和…」的口語說法（-랑）", "韓語語序：動詞在句尾、主詞常省略", "過去式（-았／었／했어요）", "ㅂ 不規則形容詞", "으 脫落（예쁘다 → 예뻐요）", "過去的喜好", "닮다 與 비슷하다 的差異", "否定：안（自己不做）與 못（做不到）", "連接動作：先…再…（-고）", "假設的擔心（-(으)면 어떡해요?）", "因為…所以（-어서／아서）", "但是（逆接 -지만）", "動詞修飾名詞：現在・習慣（-는）", "…的時候（-(으)ㄹ 때）", "修飾名詞：未來・需要（-(으)ㄹ）", "不敢…（-기 무섭다）", "推測・感嘆（-겠-）", "出去再回來（갔다 올게）", "間接引用（-다고／-라고 했어요）"];

    ex: [
      ["커피를 마셔요.", "[커피를 마셔요]", "喝咖啡。"],

// read the box sentence aloud with the browser's Korean voice
const grid = document.getElementById('grid');
cards.forEach((c, i) => {
  const n = String(i + 1).padStart(2, '0');
  const exHtml = c.ex.map(([ko, pr, zh]) =>
    `<div class="ex"><span class="exko">${ko}</span><span class="expron">${pr}</span><span class="exzh">${zh}</span></div>`
  ).join('');
  const el = document.createElement('section');
  el.className = 'card';
  el.dataset.n = i;
  el.innerHTML = `
    <div class="tape"></div><div class="qmark">?</div>
    <div class="paper">
      <div class="col col-l">
        <div class="num">${n}</div>
        <div class="gtitle">${c.title}</div>
        <div class="box">
          <div class="line">${c.line}</div>
          <div class="zhline">${c.zh}</div>
        </div>
        <div class="pron">${c.pron}</div>
        <div class="sec zh-exp"><b>說明</b>${c.expl}</div>
        <div class="sec ko-exp"><b>韓語</b>${c.ko}</div>
      </div>
      <div class="col col-r">
        <div class="exlabel">其他例句</div>
        ${exHtml}
        <div class="why"><span class="lbl">為什麼？</span>${c.why}</div>
      </div>
    </div>`;
  grid.appendChild(el);
});

// index of all lessons
document.getElementById('index').innerHTML = cards.map((c, i) => {
  const n = String(i + 1).padStart(2, '0');
  return `<a class="tile" href="#" data-n="${i + 1}"><span class="tnum">${n}</span><span class="ttitle">${c.zh}</span><span class="tsub">${CN[i]}</span></a>`;
}).join('');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

// show lesson n (1-based); 0 = index. Plain JS, no URL hash, so it works inside previews too.
function show(n) {
  const cur = n - 1;
  const isCard = n >= 1 && n <= cards.length;
  document.body.classList.toggle('view-card', isCard);
  document.querySelectorAll('.card').forEach((el, i) => { el.style.display = (isCard && i === cur) ? '' : 'none'; });
  if (isCard) {
    document.getElementById('nav').innerHTML =
      (n > 1 ? `<a href="#" data-n="${n - 1}">← 이전</a>` : '') +
      `<a href="#" data-n="0">목록</a>` +
      (n < cards.length ? `<a href="#" data-n="${n + 1}">다음 →</a>` : '');
  }
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-n]');
  if (!a) return;
  e.preventDefault();
  show(Number(a.dataset.n));
});
show(0);
</script>
